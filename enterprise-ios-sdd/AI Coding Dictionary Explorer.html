:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#ececE8;--mu:#9a9a93;--bd:#33332f;--ac:#8fa6ff;--acs:#262c4a;--ok:#6fcf86;--oks:#1e3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.sub a{color:var(--ac)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:6px 0 10px;flex-wrap:wrap}
.pbar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;width:160px;display:inline-block;vertical-align:middle;margin-left:8px}
.pbar i{display:block;height:100%;background:var(--ok);width:0}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--ac)}
.card.done{border-left:4px solid var(--ok)}
.card b{font-size:16px}
.card span{color:var(--mu);font-size:13px}
.tag{font-size:11px;color:var(--ac);background:var(--acs);padding:2px 8px;border-radius:99px;align-self:flex-start}
.empty{color:var(--mu);padding:30px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:6px 0 8px;font-size:22px}
.sheet h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.lnk{border:1px solid var(--bd);background:var(--acs);color:var(--ac);padding:4px 10px;border-radius:99px;font-size:13px;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts a{color:var(--ac);align-self:center;font-size:14px}
.btn.ok{background:var(--oks);color:var(--ok);border-color:var(--ok)}

, or restricted shell. Limits the blast radius of agent actions.", "uses": ["Environment", "Agent", "Filesystem", "AFK", "Permission mode", "Human-in-the-loop", "Agent mode"], "usedBy": ["Environment", "Filesystem", "Permission request", "Permission mode", "Agent mode", "AFK", "Automated check"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Sandbox.md"}, {"name": "Sycophancy", "section": 4, "desc": "Confidently agreeable model output. Caused by training that shaped the model to favor answers humans liked — including agreement.", "uses": ["Model", "Training", "Clearing"], "usedBy": [], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Sycophancy.md"}, {"name": "Hallucination", "section": 4, "desc": "Confidently-wrong model output. Two flavors: factuality (invented facts) and faithfulness (drift from loaded context).", "uses": ["Model", "Parametric knowledge", "Knowledge cutoff", "Contextual knowledge", "Attention degradation", "Smart zone", "Clearing", "Compaction", "Next-token prediction", "Turn"], "usedBy": ["Next-token prediction", "Parametric knowledge", "Contextual knowledge", "Smart zone"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Hallucination.md"}, {"name": "Parametric knowledge", "section": 4, "desc": "What the model knows from training, stored in its parameters. Frozen at training time. Counterpart to contextual knowledge.", "uses": ["Model", "Training", "Parameters", "Contextual knowledge", "Hallucination", "Knowledge cutoff", "Context"], "usedBy": ["Parameters", "Training", "Hallucination", "Knowledge cutoff", "Contextual knowledge"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Parametric%20knowledge.md"}, {"name": "Knowledge cutoff", "section": 4, "desc": "The date past which a model has no parametric knowledge. Post-cutoff libraries and APIs are fabrication traps unless docs are loaded.", "uses": ["Model", "Parametric knowledge", "Contextual knowledge", "Training", "Parameters", "Context"], "usedBy": ["Parameters", "Training", "Hallucination", "Parametric knowledge", "Contextual knowledge"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Knowledge%20cutoff.md"}, {"name": "Contextual knowledge", "section": 4, "desc": "Facts the agent can read directly from the context right now. Counterpart to parametric knowledge.", "uses": ["Agent", "Context", "Tool result", "AGENTS.md", "Session", "Parametric knowledge", "Context window", "Hallucination", "Model", "Knowledge cutoff", "AI", "Token", "Attention budget", "Memory system"], "usedBy": ["Hallucination", "Parametric knowledge", "Knowledge cutoff"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Contextual%20knowledge.md"}, {"name": "Attention relationship", "section": 4, "desc": "The pairing between two tokens — meaningful pairs influence each other more than unrelated ones. A context of N tokens has ~N² of these.", "uses": ["Token", "Model", "Context", "Model provider request", "Attention budget", "Attention degradation", "Smart zone"], "usedBy": ["Attention budget", "Attention degradation"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Attention%20relationship.md"}, {"name": "Attention budget", "section": 4, "desc": "Each token has a finite amount of influence to distribute across the rest of the context. Per-token, doesn't grow when context does.", "uses": ["Token", "Context", "Attention relationship", "Session", "Context window", "Attention degradation", "Clearing", "Smart zone"], "usedBy": ["Context window", "MCP", "Contextual knowledge", "Attention relationship", "Attention degradation", "Primary source", "Progressive disclosure"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Attention%20budget.md"}, {"name": "Attention degradation", "section": 4, "desc": "As a session grows, each token's attention budget spreads across more competitors; signal on meaningful relationships shrinks.", "uses": ["Session", "Token", "Attention budget", "Attention relationship", "Context", "Model", "Parameters", "Smart zone", "Turn", "Clearing", "Compaction", "Handoff"], "usedBy": ["Context", "Hallucination", "Attention relationship", "Attention budget", "Smart zone"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Attention%20degradation.md"}, {"name": "Smart zone", "section": 4, "desc": "Early in a session the agent is sharp and focused. As the session grows it drifts into a dumb zone: sloppier, forgetful, more mistakes.", "uses": ["Session", "Agent", "Hallucination", "Model", "Harness", "Context", "Attention degradation", "Token", "Clearing", "Compaction", "Context window", "Handoff"], "usedBy": ["Stateful", "Hallucination", "Attention relationship", "Attention budget", "Attention degradation", "Spec", "Ticket", "AX"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Smart%20zone.md"}, {"name": "Clearing", "section": 5, "desc": "Ending the current session and starting a fresh one. The next message begins with an empty session and an empty context window.", "uses": ["Session", "Context window", "Tool result", "Model", "Turn", "Agent", "Context", "Harness", "Stateless", "Handoff artifact", "Compaction"], "usedBy": ["Input tokens", "Stateless", "Context window", "Stateful", "Session", "Sycophancy", "Hallucination", "Attention budget", "Attention degradation", "Smart zone", "Handoff", "Handoff artifact", "Spec", "Compaction", "Memory system"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Clearing.md"}, {"name": "Handoff", "section": 5, "desc": "Transferring agent context from one session to another, with no return path. Carry mechanism varies — artifact, compaction, others.", "uses": ["Agent", "Context", "Session", "Handoff artifact", "Compaction", "Clearing", "AFK", "Context window", "Model", "Stateless", "Environment"], "usedBy": ["Session", "Attention degradation", "Smart zone", "Handoff artifact", "Compaction", "Subagent"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Handoff.md"}, {"name": "Primary source", "section": 5, "desc": "The thing itself — code, transcripts, raw data. Complete and authoritative, but expensive to load into context.", "uses": ["Secondary source", "Agent", "Context window", "Token", "Input tokens", "Attention budget", "Context"], "usedBy": ["Secondary source", "Handoff artifact", "Compaction", "Context pointer", "Human review"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Primary%20source.md"}, {"name": "Secondary source", "section": 5, "desc": "An account of a primary source, one step removed — summaries, docs, compaction summaries. Cheap to load, lossy by construction.", "uses": ["Primary source", "Context window", "Context", "Compaction", "Session", "Subagent", "Handoff artifact", "Memory system", "Agent", "Context pointer"], "usedBy": ["Primary source", "Handoff artifact", "Compaction", "Memory system", "Context pointer", "Subagent", "Human review"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Secondary%20source.md"}, {"name": "Handoff artifact", "section": 5, "desc": "A document used as the carry mechanism for a handoff — written by one session to be read by another.", "uses": ["Handoff", "Environment", "Session", "Spec", "Ticket", "Model", "Stateless", "Clearing", "Context", "Secondary source", "Primary source", "Compaction", "Agent"], "usedBy": ["Stateless", "Stateful", "Environment", "Clearing", "Handoff", "Secondary source", "Spec", "Ticket", "Autocompact", "Design concept", "Grilling"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Handoff%20artifact.md"}, {"name": "Spec", "section": 5, "desc": "A handoff artifact describing a multi-session piece of work — what's being built, not how each session does its share. Made of tickets.", "uses": ["Handoff artifact", "Session", "Ticket", "Context window", "Context", "Environment", "Clearing", "Agent", "Smart zone"], "usedBy": ["Handoff artifact", "Ticket", "AFK", "Design concept", "Grilling", "Prototyping"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Spec.md"}, {"name": "Ticket", "section": 5, "desc": "A handoff artifact scoping one session of work. Stands alone or hangs off a spec. Can block or be blocked by sibling tickets.", "uses": ["Handoff artifact", "Session", "Spec", "Smart zone", "Context", "Context pointer", "Software factory"], "usedBy": ["Handoff artifact", "Spec", "Software factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Ticket.md"}, {"name": "Compaction", "section": 5, "desc": "A handoff done in-memory: the previous session's history is summarised and seeds a fresh session. Lossy — detail traded for headroom.", "uses": ["Handoff", "Session", "Primary source", "Secondary source", "Autocompact", "Context window", "Tool result", "Harness", "Model", "Context pointer", "Clearing", "Context"], "usedBy": ["Harness", "Input tokens", "Context window", "Session", "Hallucination", "Attention degradation", "Smart zone", "Clearing", "Handoff", "Secondary source", "Handoff artifact", "Autocompact"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Compaction.md"}, {"name": "Autocompact", "section": 5, "desc": "Compaction triggered automatically by the harness when the context window approaches full.", "uses": ["Compaction", "Harness", "Context window", "Model", "Session", "Agent", "Handoff artifact", "Turn"], "usedBy": ["Compaction"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Autocompact.md"}, {"name": "Memory system", "section": 6, "desc": "A system that attempts to make an agent stateful across sessions by persisting to the environment and reloading at session start.", "uses": ["Agent", "Stateful", "Session", "Environment", "Context window", "Clearing", "Harness", "AGENTS.md", "Context pointer", "Secondary source", "Filesystem", "Turn", "Model", "Stateless"], "usedBy": ["Inference", "Stateless", "Context window", "Stateful", "Session", "Environment", "Contextual knowledge", "Secondary source"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Memory%20system.md"}, {"name": "AGENTS.md", "section": 6, "desc": "A file in the environment that the harness loads into the context window at session start — the project's standing brief to the agent.", "uses": ["Environment", "Harness", "Context window", "Session", "Agent", "Model", "Stateless", "Progressive disclosure", "Token", "Turn", "Skill", "Context pointer"], "usedBy": ["Harness", "Stateless", "Stateful", "System prompt", "Session", "Environment", "Filesystem", "Contextual knowledge", "Memory system", "Progressive disclosure", "Context pointer", "Skill", "DX", "AX"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/AGENTS.md.md"}, {"name": "Progressive disclosure", "section": 6, "desc": "Loading only the context an agent needs right now, with context pointers to the rest. Borrowed from UI design.", "uses": ["Context", "Agent", "Context pointer", "Token", "Input tokens", "Turn", "Attention budget", "AGENTS.md", "Skill", "Harness", "Session"], "usedBy": ["AGENTS.md", "Context pointer", "Skill"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Progressive%20disclosure.md"}, {"name": "Context pointer", "section": 6, "desc": "A mention in one document that points to another, so the agent can pull it into context only when the task calls for it.", "uses": ["Agent", "Context window", "Progressive disclosure", "Token", "AGENTS.md", "Session", "Tool call", "Skill", "Secondary source", "Primary source"], "usedBy": ["Filesystem", "MCP", "Secondary source", "Ticket", "Compaction", "Memory system", "AGENTS.md", "Progressive disclosure", "Skill"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Context%20pointer.md"}, {"name": "Skill", "section": 6, "desc": "A teachable capability bundled as a unit — kept out of the context window until a context pointer pulls it in for the task at hand.", "uses": ["Environment", "Context pointer", "Context window", "Progressive disclosure", "Harness", "Agent", "Context", "Token", "AGENTS.md", "Session", "Tool", "Turn"], "usedBy": ["Filesystem", "AGENTS.md", "Progressive disclosure", "Context pointer", "AX"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Skill.md"}, {"name": "Subagent", "section": 6, "desc": "An agent spawned by another agent via a tool call. Runs in its own session, reports a single tool result. Cannot spawn further subagents.", "uses": ["Agent", "Tool call", "Session", "Context window", "Tool result", "Handoff", "Context", "Secondary source"], "usedBy": ["Secondary source", "Automated review"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Subagent.md"}, {"name": "Human-in-the-loop", "section": 7, "desc": "A working pattern where one or more humans pair with the agent during a session — reviewing, redirecting, or collaborating in real time.", "uses": ["Agent", "Session", "AFK", "Grilling", "Prototyping", "Automated check", "Human review", "Software factory"], "usedBy": ["Permission request", "Permission mode", "Sandbox", "Human review", "Grilling", "Prototyping", "Software factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Human-in-the-loop.md"}, {"name": "AFK", "section": 7, "desc": "A working pattern where the user kicks off a session and leaves the agent to run unattended (away from keyboard).", "uses": ["Session", "Agent", "AI", "Permission mode", "Sandbox", "Grilling", "Spec", "Automated check", "Automated review", "Human review", "AX", "Agent mode", "Filesystem"], "usedBy": ["Turn", "Permission request", "Permission mode", "Agent mode", "Sandbox", "Handoff", "Human-in-the-loop", "Automated check", "Automated review", "Human review", "Software factory", "Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/AFK.md"}, {"name": "Automated check", "section": 7, "desc": "A deterministic verification that runs in the environment — tests, type checks, lints, build, pre-commit hooks. Pass/fail, no judgement.", "uses": ["Environment", "Agent", "Tool call", "Context window", "AX", "AFK", "Automated review", "Human review", "Sandbox"], "usedBy": ["Non-determinism", "Human-in-the-loop", "AFK", "Automated review", "Human review", "Vibe coding", "AX", "Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Automated%20check.md"}, {"name": "Automated review", "section": 7, "desc": "An agent reviewing another agent's work, often with a different model or system prompt. Non-deterministic: it forms a judgement.", "uses": ["Agent", "Model", "System prompt", "Subagent", "Automated check", "Session", "Context window", "Human review", "AFK"], "usedBy": ["AFK", "Automated check", "Human review", "Vibe coding", "Software factory", "Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Automated%20review.md"}, {"name": "Human review", "section": 7, "desc": "The user reading the code the agent produced and forming a judgement on it. Reading the diff counts; reading the summary doesn't.", "uses": ["Agent", "Secondary source", "Primary source", "Automated check", "Automated review", "AFK", "Human-in-the-loop"], "usedBy": ["Human-in-the-loop", "AFK", "Automated check", "Automated review", "Vibe coding", "Software factory", "Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Human%20review.md"}, {"name": "Vibe coding", "section": 7, "desc": "A working pattern where the user accepts the agent's code without human review. The diff is treated as opaque.", "uses": ["Agent", "Human review", "Automated review", "Automated check", "Prototyping", "Software factory", "Dark factory"], "usedBy": ["Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Vibe%20coding.md"}, {"name": "Design concept", "section": 7, "desc": "The shared understanding of what's being built, held in common between user and agent but separate from any asset.", "uses": ["Agent", "Handoff artifact", "Grilling", "Spec"], "usedBy": ["Grilling"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Design%20concept.md"}, {"name": "Grilling", "section": 7, "desc": "A technique for developing a design concept: the agent interviews the user Socratically, one decision at a time.", "uses": ["Design concept", "Agent", "Handoff artifact", "Spec", "Human-in-the-loop", "Prototyping"], "usedBy": ["Human-in-the-loop", "AFK", "Design concept", "Prototyping"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Grilling.md"}, {"name": "Prototyping", "section": 7, "desc": "Having the agent build a quick, rough version when conversation is too low-fidelity and you need a real artifact to talk about.", "uses": ["Agent", "Grilling", "Human-in-the-loop", "Spec"], "usedBy": ["Human-in-the-loop", "Vibe coding", "Grilling"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Prototyping.md"}, {"name": "DX", "section": 7, "desc": "Developer experience: how easy a codebase and its toolchain make it for humans to do good work — docs, feedback speed, errors.", "uses": ["AX", "Stateful", "Stateless", "Agent", "Session", "Environment", "Tool result", "Context window", "AGENTS.md"], "usedBy": ["AX"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/DX.md"}, {"name": "AX", "section": 7, "desc": "Agent experience: how well the environment is set up for an agent to do good work — checks, architecture, and free context.", "uses": ["Environment", "Agent", "DX", "Model", "Harness", "Automated check", "AGENTS.md", "Skill", "Tool", "Context window", "Smart zone", "Tool result"], "usedBy": ["Environment", "AFK", "Automated check", "DX"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/AX.md"}, {"name": "Software factory", "section": 7, "desc": "A system of work where triggers, not humans, start agent sessions, so more work runs AFK and HITL time is saved for what needs it.", "uses": ["Agent", "Session", "AFK", "Human-in-the-loop", "Ticket", "Automated review", "Human review", "Dark factory"], "usedBy": ["Ticket", "Human-in-the-loop", "Vibe coding", "Dark factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Software%20factory.md"}, {"name": "Dark factory", "section": 7, "desc": "A codebase, or part of one, where a software factory writes the code and no human ever reviews it.", "uses": ["Software factory", "Human review", "Vibe coding", "Automated check", "Automated review", "Agent", "Session", "AFK"], "usedBy": ["Vibe coding", "Software factory"], "url": "https://github.com/mattpocock/dictionary-of-ai-coding/blob/main/dictionary/Dark%20factory.md"}]};
const byName={};D.entries.forEach(e=>byName[e.name]=e);
let sec=0,query="",learned=new Set();
try{learned=new Set(JSON.parse(localStorage.getItem("aicd-learned")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("aicd-learned",JSON.stringify([...learned]))}catch(e){}}
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function chips(){
 const all=[["All",0]].concat(D.sections.map((s,i)=>[s.replace(/^Section \d+ — /,""),i+1]));
 $("chips").innerHTML=all.map(([t,i])=>`<button class="chip ${sec===i?"on":""}" data-s="${i}">${esc(t)}</button>`).join("");
}
function render(){
 const q=query.toLowerCase();
 const list=D.entries.filter(e=>(!sec||e.section===sec)&&(!q||e.name.toLowerCase().includes(q)||e.desc.toLowerCase().includes(q)));
 $("count").textContent=list.length+" of "+D.entries.length+" terms";
 $("grid").innerHTML=list.length?list.map(e=>`<button class="card ${learned.has(e.name)?"done":""}" data-n="${esc(e.name)}"><span class="tag">${esc(D.sections[e.section-1].replace(/^Section (\d+) — /,"$1 · "))}</span><b>${esc(e.name)}</b><span>${esc(e.desc)}</span></button>`).join(""):'<div class="empty">No terms match.</div>';
 $("lc").textContent=learned.size;$("lt").textContent=D.entries.length;
 $("pb").style.width=(100*learned.size/D.entries.length)+"%";
}
function open(n){
 const e=byName[n];if(!e)return;
 const ch=a=>a.length?`<div class="row">${a.map(x=>`<button class="lnk" data-n="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:'<span class="sub">None</span>';
 const done=learned.has(n);
 $("sheet").innerHTML=`<span class="tag">${esc(D.sections[e.section-1])}</span><h2>${esc(n)}</h2><p>${esc(e.desc)}</p>
 <h4>Builds on</h4>${ch(e.uses)}<h4>Used by</h4>${ch(e.usedBy)}
 <div class="acts"><button class="btn ${done?"ok":""}" id="mk">${done?"✓ Learned":"Mark as learned"}</button><a href="${e.url}" target="_blank" rel="noopener">Read full entry ↗</a><button class="btn" id="cl">Close</button></div>`;
 $("ov").classList.add("show");
 $("mk").onclick=()=>{done?learned.delete(n):learned.add(n);save();render();open(n)};
 $("cl").onclick=()=>$("ov").classList.remove("show");
}
$("q").oninput=e=>{query=e.target.value;render()};
$("chips").onclick=e=>{const b=e.target.closest("[data-s]");if(b){sec=+b.dataset.s;chips();render()}};
$("grid").onclick=e=>{const b=e.target.closest("[data-n]");if(b)open(b.dataset.n)};
$("sheet").onclick=e=>{const b=e.target.closest(".lnk");if(b)open(b.dataset.n)};
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("show")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("ov").classList.remove("show")});
$("rs").onclick=()=>{learned.clear();save();render()};
chips();render();
</script></body></html>
