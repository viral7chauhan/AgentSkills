name: SDD Validation

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: sdd-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdd:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Validate SDD structure, traceability, and execution evidence
        run: make validate

      - name: Check derived status and traceability
        run: make status-check

      # Runs the build system, scheme, and platform declared in .sdd/project/build.yaml.
      - name: Build and test
        run: make test

      # A feature that claims VERIFIED or CONVERGED fails here unless every test case in its test plan passed above.
      - name: SDD CI gate
        if: success() || failure()
        run: make ci-gate
