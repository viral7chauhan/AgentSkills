name: Release Readiness

on:
  workflow_dispatch:

jobs:
  readiness:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: SDD validation and execution evidence
        run: make validate

      - name: Check derived status and traceability
        run: make status-check

      - name: Build and test
        run: make test

      - name: SDD CI gate
        run: make ci-gate
